[package]
name = "conduit-ai"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Conduit — lightweight AI driver for OpenAI-compatible, Ollama, Anthropic, Gemini (Rust, sync)"
repository = "https://github.com/krazybean/Conduit"
homepage = "https://github.com/krazybean/Conduit"
readme = "README.md"
keywords = ["ai", "llm", "openai", "ollama", "anthropic", "gemini"]
categories = ["api-bindings"]

[lib]
name = "conduit"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }

[dev-dependencies]
serde_json = "1.0"
