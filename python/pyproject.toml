[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conduit-llm"
version = "0.2.0"
description = "Conduit — lightweight AI driver for OpenAI-compatible, Ollama, Anthropic, Gemini (Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
authors = [{ name = "Conduit Contributors" }]
maintainers = [{ name = "Conduit Contributors" }]
keywords = ["ai", "llm", "openai", "ollama", "anthropic", "gemini"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/krazybean/Conduit"
Repository = "https://github.com/krazybean/Conduit"
Documentation = "https://github.com/krazybean/Conduit#readme"
Issues = "https://github.com/krazybean/Conduit/issues"

[tool.hatch.build.targets.wheel]
packages = ["conduit"]
