name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --prefix typescript
      - run: npm run typecheck --prefix typescript
      - run: npm test --prefix typescript

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: PYTHONPATH=python:python/tests python3 -m unittest discover -s python/tests -v

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - run: rustc --version
      - run: cargo --version
      - run: grep -n 'ureq' rust/Cargo.toml
      - run: cargo tree --manifest-path rust/Cargo.toml -i ureq
      - run: cargo metadata --manifest-path rust/Cargo.toml --format-version 1 | grep -o '"name":"ureq","version":"[^"]*"'
      - run: cargo test --manifest-path rust/Cargo.toml
